[project]
name = "travel-agent-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Domenico Mirabelli",email = "domenicomirabelli@outlook.it"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.162.1,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langgraph (>=1.2.20,<2.0.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "google-search-results (>=2.4.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "travel_agent_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
